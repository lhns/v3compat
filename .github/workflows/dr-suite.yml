name: dr-suite
# DynamoRIO's own test suite, base and fix of the fork built on the same runner (docs/howto.md). Push a suite-*
# branch that sets BASE and FIX below; the summary lists tests that fail on one side only, each rerun 20 times.
on:
  push:
    branches: ['suite-*']

permissions:
  contents: read

env:
  BASE: 14836b0e1dfbc5b5d2f089102d83a38f3d38ed94
  FIX: 876631ddbb16b80183318731e9839e870bc2077c
jobs:
  suite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]
        rep: [a]
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev \
            g++-multilib libunwind-dev libelf-dev
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: One-sided failures, base and fix built in the same directory
        run: |
          set +e
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          { grep -m1 'model name' /proc/cpuinfo; grep -o -m1 avx512f /proc/cpuinfo; uname -r; } | tee "$out/cpu.txt"
          flags="-DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DRUN_SUDO_TESTS=ON -DBUILD_DOCS=OFF"
          if [ "${{ matrix.build }}" = debug ]; then flags="$flags -DDEBUG=ON -DINTERNAL=ON"; else flags="$flags -DDEBUG=OFF"; fi
          T='memory_dump_test|client.detach_test|drcachesim.simple|irregular-windows-simple|signal_pre_syscall'
          for sha in $BASE $FIX; do
            s=${sha:0:7}; rm -rf dr b
            git clone -q --filter=blob:none https://github.com/lhns/dynamorio dr && git -C dr checkout -q $sha && git -C dr submodule update -q --init --depth 1
            cmake -S dr -B b $flags >/dev/null && cmake --build b -j"$(nproc)" >/dev/null 2>&1 || echo "$s: build failed" | tee -a "$out/summary.txt"
            for k in $(cd b && ctest -N -R "$T" | sed -n 's/^ *Test *#[0-9]*: //p'); do
              kre=$(printf '%s' "$k" | sed 's/[][\\.|$^*+?(){}]/\\&/g')
              f=0; for i in $(seq 20); do (cd b && ctest -R "^$kre\$" --timeout 300 >/dev/null 2>&1) || f=$((f+1)); done
              echo "same-dir $s $k: $f of 20 failed" | tee -a "$out/summary.txt"
            done
          done
          { echo "## ${{ matrix.build }}-${{ matrix.rep }}-${{ matrix.os }}"; echo '```'; cat "$out/cpu.txt" "$out/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.build }}-${{ matrix.rep }}-${{ matrix.os }}
          path: ${{ runner.temp }}/out

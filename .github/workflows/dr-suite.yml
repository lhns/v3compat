name: dr-suite
on:
  push:
    branches: [suite-pad]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        sha: [5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, 416dd4b5c6d2cba0c1005f3f05b11a2200113f4e]
        build: [release, debug]
        rep: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lhns/dynamorio
          ref: ${{ matrix.sha }}
          submodules: true
          path: dr
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev \
            g++-multilib libunwind-dev libelf-dev
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: Configure
        run: |
          flags="-DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DRUN_SUDO_TESTS=ON -DBUILD_DOCS=OFF"
          if [ "${{ matrix.build }}" = debug ]; then
            flags="$flags -DDEBUG=ON -DINTERNAL=ON"
          else
            flags="$flags -DDEBUG=OFF"
          fi
          cmake -S dr -B build $flags
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        working-directory: build
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          t="${{ matrix.sha }}-${{ matrix.build }}"
          { grep -m1 'model name' /proc/cpuinfo; grep -o -m1 avx512f /proc/cpuinfo; } | tee "$out/$t-cpu.txt"
          extract() { sed -n 's/^[0-9]*://p' Testing/Temporary/LastTestsFailed.log 2>/dev/null | sort > "$1"; }
          ctest -j"$(nproc)" --timeout 300 --output-on-failure || true
          extract "$out/$t-first.txt"
          cp Testing/Temporary/LastTest.log "$out/$t-LastTest.log" || true
          ctest -j"$(nproc)" --timeout 300 --output-on-failure --rerun-failed || true
          extract "$out/$t-rerun.txt"
          cp Testing/Temporary/LastTest.log "$out/$t-LastTest-rerun.log" || true
          {
            echo "## $t"
            echo "### First pass failures ($(wc -l < "$out/$t-first.txt"))"
            echo '```'; cat "$out/$t-first.txt"; echo '```'
            echo "### Rerun failures ($(wc -l < "$out/$t-rerun.txt"))"
            echo '```'; cat "$out/$t-rerun.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.sha }}-${{ matrix.build }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/out

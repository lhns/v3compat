name: dr-diag
on:
  push:
    branches: [suite-pad]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
        sha: [7abc05ea0abc2489453c3c729264a846cb167ce1, 8ef72a76c053ae75afdc9ee8dfcf77a898d39b10]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lhns/dynamorio
          ref: ${{ matrix.sha }}
          submodules: true
          path: dr
      - name: Packages
        run: sudo apt-get update && sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev g++-multilib libunwind-dev libelf-dev
      - name: Build
        run: |
          f="-DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DBUILD_DOCS=OFF"
          [ "${{ matrix.build }}" = debug ] && f="$f -DDEBUG=ON -DINTERNAL=ON" || f="$f -DDEBUG=OFF"
          cmake -S dr -B build $f >/dev/null && cmake --build build -j"$(nproc)" >/dev/null
      - name: Diagnose
        working-directory: build
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"; grep -m1 'model name' /proc/cpuinfo
          for k in linux.syscall_pwait client.annotation-concurrency; do f=0; for i in $(seq 20); do ctest -R "\|$k\$" --timeout 300 >/dev/null 2>&1 || { f=$((f+1)); cp Testing/Temporary/LastTest.log "$out/$k-fail$f.log"; }; done; echo "repeat-count $k: $f of 20 failed" | tee -a "$out/repeat.txt"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.build }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/out

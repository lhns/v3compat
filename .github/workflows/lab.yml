name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: f1, dr: 2eae693c2f3f6fb79510657296ce769b74af642c, arg: "1500 sig jit"}
          - {name: f2, dr: 2eae693c2f3f6fb79510657296ce769b74af642c, arg: "1500 sig jit"}
          - {name: f3, dr: 2eae693c2f3f6fb79510657296ce769b74af642c, arg: "1500 sig jit"}
          - {name: f4, dr: 2eae693c2f3f6fb79510657296ce769b74af642c, arg: "1500 sig jit"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: lab-dr-${{ matrix.dr }}
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools gdb zstd
      - name: Build
        run: |
          sed -i "s/^set(V3COMPAT_DR_COMMIT .*/set(V3COMPAT_DR_COMMIT ${{ matrix.dr }})/" cmake/FetchDynamoRIO.cmake
          cmake -S . -B build && cmake --build build -j
      - name: Run
        timeout-minutes: 280
        env:
          ARG: ${{ matrix.arg }}
        run: |
          mkdir -p lab-out
          bash lab/run.sh $ARG 2>&1 | tee lab-out/log.txt | tail -200
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```'; tail -40 lab-out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: lab-out
          if-no-files-found: ignore

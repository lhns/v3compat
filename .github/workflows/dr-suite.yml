name: dr-suite
on:
  push:
    branches: [dr-suite]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        sha: [39074ef92f0864e328ac74d0f00b9022f8ef4f8f, f6e248798251a736e0ebf7c66c88ad9947c21cd2]
        build: [release]
        rep: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lhns/dynamorio
          ref: ${{ matrix.sha }}
          submodules: true
          path: dr
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev \
            g++-multilib libunwind-dev libelf-dev
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: Configure
        run: |
          flags="-DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DRUN_SUDO_TESTS=ON -DBUILD_DOCS=OFF"
          if [ "${{ matrix.build }}" = debug ]; then
            flags="$flags -DDEBUG=ON -DINTERNAL=ON"
          else
            flags="$flags -DDEBUG=OFF"
          fi
          cmake -S dr -B build $flags
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        working-directory: build
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          t="${{ matrix.sha }}-${{ matrix.build }}"
          grep -m1 'model name' /proc/cpuinfo | tee "$out/$t-cpu.txt"
          n=0; f=0
          run() { for i in $(seq 40); do n=$((n+1)); ctest -R 'client\.attach_test$' --timeout 120 >/dev/null 2>&1 || { f=$((f+1)); cat suite/tests/client.attach_test*.out suite/tests/*attach_test*.err >> "$out/$t-fail.txt" 2>/dev/null; sed -n '/attach_test/,$p' Testing/Temporary/LastTest.log | tail -25 >> "$out/$t-fail.txt"; }; done; echo "$1: $f failed of $n" | tee -a "$out/$t-counts.txt"; n=0; f=0; }
          run idle
          for i in $(seq "$(nproc)"); do (yes >/dev/null) & done
          run loaded
          pkill yes || true
          cat "$out/$t-counts.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.sha }}-${{ matrix.build }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/out

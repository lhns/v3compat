name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require AVX2 (CPUID)
        run: |
          cat > cpuid.c <<'C'
          #include <cpuid.h>
          #include <stdio.h>
          int main(void) {
              unsigned a, b, c, d;
              __cpuid_count(7, 0, a, b, c, d);
              printf("AVX2=%u BMI1=%u BMI2=%u\n", (b >> 5) & 1, (b >> 3) & 1, (b >> 8) & 1);
              return !((b >> 5) & 1);
          }
          C
          gcc cpuid.c -o cpuid && ./cpuid
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          # The file holds the pinned commit and the build options.
          key: dynamorio-${{ hashFiles('cmake/FetchDynamoRIO.cmake') }}
      - name: DynamoRIO build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools
      - name: Configure
        run: cmake -S . -B build -DV3COMPAT_SEMANTIC=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          V3COMPAT_CI: "1"
        # setuid's checks run as uid 65534, which must reach the build tree.
        run: chmod o+x "$HOME" && ctest --test-dir build --output-on-failure
      - name: Real programs hit no form off the list; duckdb, native against the client
        run: |
          img='duckdb/duckdb:2.0.0@sha256:453caf4f1c445ee8363acaa6cd383751396d2eae0d02f362ada64d87267a4221'
          docker pull -q "$img"; c=$(docker create "$img"); docker cp "$c:/duckdb" ./duckdb; docker rm "$c"
          sudo apt-get install -y zstd
          set -o pipefail
          sh test/apps/audit.sh build/inst/bin/v3compat-run ./duckdb
          sh test/apps/duckdb-reset.sh "build/inst/bin/v3compat-run --" ./duckdb 15
          sh test/apps/duckdb.sh "" ./duckdb | tee native.txt
          # Repeated: thread-interleaving faults are intermittent (docs/adr/0010).
          sh test/apps/duckdb.sh "build/inst/bin/v3compat-run --" ./duckdb 30 | tee client.txt
          diff <(sed 's/ wall.*//' native.txt | sort) <(sed 's/ wall.*//' client.txt | sort -u)
      - name: The probe's results on this CPU, the list's AVX2 evidence (test/allow/regen.sh)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allow-probe
          path: build/test/allow_probe.tsv
      - name: Tarball
        run: |
          cmake --build build --target package-tarball
          tar tzf build/v3compat-*-linux-x86_64.tar.gz

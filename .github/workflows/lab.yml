name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3dbg
          key: dynamorio-debug-${{ hashFiles('cmake/FetchDynamoRIO.cmake') }}
      - name: Packages
        run: for i in 1 2 3 4 5 6; do sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools gdb && break; sleep 60; done
      - name: Build a debug fork and the null client against it
        run: |
          sed -i 's/-DDEBUG=OFF/-DDEBUG=ON/' cmake/FetchDynamoRIO.cmake
          cmake -S . -B build -DV3COMPAT_DR_CACHE=$HOME/.cache/v3dbg > /dev/null 2>&1 || true
          D=$(ls -d ~/.cache/v3dbg/dr-*[0-9a-f]/); ls $D/lib64
          cmake -S lab/nullclient -B /tmp/null-dbg-b -DDynamoRIO_DIR=${D}cmake -DDEBUG=ON && cmake --build /tmp/null-dbg-b && mkdir -p /tmp/null-dbg && cp /tmp/null-dbg-b/libnull.so /tmp/null-dbg/
          mkdir -p /tmp/bench/classes && "$JAVA_HOME_21_X64/bin/javac" -d /tmp/bench/classes bench/Bench.java
      - name: Run
        timeout-minutes: 280
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          mkdir -p lab-out; bash lab/dbg.sh 2>&1 | tee lab-out/log.txt | grep -E '^== run|Internal Error|debug check|ASSERT|pid=|no failure|rc='
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-dbg
          path: lab-out

# LAB: client.memory_dump_test on debug builds of base, the trace fix and a layout-only control, 20 runs each.
name: dr-suite
on:
  push:
    branches: ['suite-*']
permissions:
  contents: read
jobs:
  memdump:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev g++-multilib libunwind-dev libelf-dev
      - name: Build and run
        run: |
          set +e
          grep -m1 'model name' /proc/cpuinfo
          for sha in 7e8c88b7c0e43c1d16d92f8d7a002a872c788559 da60578e58d56694968b2fb34b300f1af61608f0 a7356a63f6132924798e25b42eeb5c0bba07bcb7; do
            s=${sha:0:7}
            git clone -q --filter=blob:none https://github.com/lhns/dynamorio dr-$s && git -C dr-$s checkout -q $sha && git -C dr-$s submodule update -q --init --depth 1
            cmake -S dr-$s -B b-$s -DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DBUILD_DOCS=OFF -DDEBUG=ON -DINTERNAL=ON >/dev/null && cmake --build b-$s -j"$(nproc)" >/dev/null 2>&1 || echo "$s: build failed"
          done
          for s in 7e8c88b da60578 a7356a6; do
            f=0; for i in $(seq 20); do (cd b-$s && ctest -R 'client.memory_dump_test$' --timeout 300 >/dev/null 2>&1) || f=$((f+1)); done
            echo "RESULT memory_dump_test $s: $f of 20 failed"
          done
          (cd b-a7356a6 && ctest -R 'client.memory_dump_test$' --output-on-failure 2>&1 | grep -E '^\s*\[[0-9 ]+\]|vvar|vdso' | head -20)

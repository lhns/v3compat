name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: map32, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "map32 300"}
          - {name: m32, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "m32 300"}
          - {name: gather1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "gather 300"}
          - {name: gather2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "gather 300"}
          - {name: duck1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "duck 60"}
          - {name: duck2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "duck 60"}
          - {name: duck3, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "duck 60"}
          - {name: duck4, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "duck 60"}
          - {name: sig1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "sig 130"}
          - {name: sig2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "sig 130"}
          - {name: sig3, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "sig 130"}
          - {name: regc1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regc 34"}
          - {name: regc2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regc 34"}
          - {name: regc3, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regc 34"}
          - {name: regd1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regd 34"}
          - {name: regd2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regd 34"}
          - {name: regd3, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "regd 34"}
          - {name: short1, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "short 1500"}
          - {name: short2, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "short 1500"}
          - {name: short3, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "short 1500"}
          - {name: tests, dr: 1b8b780e84667803d5b5256ea41d2493be3bce09, arg: "tests 100"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: lab-dr-${{ matrix.dr }}
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools gdb zstd
      - name: Build
        run: |
          sed -i "s/^set(V3COMPAT_DR_COMMIT .*/set(V3COMPAT_DR_COMMIT ${{ matrix.dr }})/" cmake/FetchDynamoRIO.cmake
          cmake -S . -B build && cmake --build build -j
      - name: Run
        timeout-minutes: 280
        env:
          ARG: ${{ matrix.arg }}
        run: |
          mkdir -p lab-out
          bash lab/run.sh $ARG 2>&1 | tee lab-out/log.txt | tail -200
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```'; tail -40 lab-out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: lab-out
          if-no-files-found: ignore

name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: a1, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a2, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a3, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a4, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a5, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a6, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a7, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a8, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a9, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a10, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a11, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a12, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a13, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a14, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a15, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a16, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a17, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a18, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a19, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
          - {name: a20, dr: 170636512328371f9cafe0125bad237be525f599, arg: "3000 jit"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: lab-dr-${{ matrix.dr }}
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools gdb zstd
      - name: Build
        run: |
          sed -i "s/^set(V3COMPAT_DR_COMMIT .*/set(V3COMPAT_DR_COMMIT ${{ matrix.dr }})/" cmake/FetchDynamoRIO.cmake
          cmake -S . -B build && cmake --build build -j
      - name: Run
        timeout-minutes: 280
        env:
          ARG: ${{ matrix.arg }}
        run: |
          mkdir -p lab-out
          bash lab/run.sh $ARG 2>&1 | tee lab-out/log.txt | tail -200
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```'; tail -40 lab-out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: lab-out
          if-no-files-found: ignore

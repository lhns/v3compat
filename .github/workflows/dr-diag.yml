name: dr-diag
on:
  push:
    branches: [suite-pad]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lhns/dynamorio
          ref: f7166961d69bc0606522421b86eef5f779a0ddb5
          submodules: true
          path: dr
      - name: Packages
        run: sudo apt-get update && sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev g++-multilib libunwind-dev libelf-dev
      - name: Build
        run: |
          f="-DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DBUILD_DOCS=OFF"
          [ "${{ matrix.build }}" = debug ] && f="$f -DDEBUG=ON -DINTERNAL=ON" || f="$f -DDEBUG=OFF"
          cmake -S dr -B build $f >/dev/null && cmake --build build -j"$(nproc)" >/dev/null
      - name: Diagnose
        working-directory: build
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"; grep -m1 'model name' /proc/cpuinfo
          for t in linux.syscall_pwait client.annotation-concurrency; do
            cmdline=$(ctest -R "\|$t\$" -N -V | sed -n 's/^[0-9]*: Test command: //p' | head -1)
            echo "== $t: $cmdline" | cut -c1-300
            for mode in asis nopad; do
              c="$cmdline"; [ $mode = nopad ] && c=$(echo "$cmdline" | sed 's#bin64/drrun" #bin64/drrun" "-no_pad_jmps" #')
              f=0; for i in $(seq 10); do eval timeout 120 $c > "$out/$t-$mode.out" 2>&1 || f=$((f+1)); done
              echo "$t $mode: rc-fail $f of 10; last tail:"; tail -3 "$out/$t-$mode.out" | cut -c1-200
            done
          done
          if [ "${{ matrix.build }}" = debug ]; then
            cmdline=$(ctest -R "\|linux.syscall_pwait\$" -N -V | sed -n 's/^[0-9]*: Test command: //p' | head -1)
            mkdir -p "$out/logs"; c=$(echo "$cmdline" | sed "s#bin64/drrun\" #bin64/drrun\" \"-loglevel\" \"3\" \"-logmask\" \"0x18\" \"-logdir\" \"$out/logs\" #")
            eval timeout 120 $c > "$out/pwait-log.out" 2>&1; echo "logged rc=$?"; du -sh "$out/logs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.build }}
          path: ${{ runner.temp }}/out

name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        job: [b1, b2, b3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: dynamorio-${{ hashFiles('cmake/FetchDynamoRIO.cmake') }}
      - name: Packages
        run: |
          for i in 1 2 3 4 5 6; do sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools time linux-tools-common "linux-tools-$(uname -r)" && break; sleep 60; done
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          sudo mount -o remount,mode=755 /sys/kernel/tracing || sudo chmod -R a+rx /sys/kernel/tracing || true
      - name: Build
        run: |
          cmake -S . -B build && cmake --build build -j
          mkdir -p /tmp/bench/classes
          gcc -O3 -march=x86-64-v3 bench/fma.c -o /tmp/bench/fma -lm
          "$JAVA_HOME_21_X64/bin/javac" -d /tmp/bench/classes bench/Bench.java
          img='duckdb/duckdb:2.0.0@sha256:453caf4f1c445ee8363acaa6cd383751396d2eae0d02f362ada64d87267a4221'
          docker pull -q "$img"; c=$(docker create "$img"); docker cp "$c:/duckdb" ./duckdb; docker rm "$c"
      - name: Run
        timeout-minutes: 300
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          mkdir -p lab-out
          bash bench/run.sh all 3 2>&1 | tee lab-out/log.txt | grep -E '^(RESULT|model name|OPS|AUDIT|PERF|STAT|STDERR)'
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.job }}"; echo '```'; grep -E '^(RESULT|model name)' lab-out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.job }}
          path: lab-out
          if-no-files-found: ignore

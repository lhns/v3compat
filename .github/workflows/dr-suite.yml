# LAB: client.memory_dump_test on debug builds of base, the trace fix and a layout-only control, 20 runs each.
name: dr-suite
on:
  push:
    branches: ['suite-*']
permissions:
  contents: read
jobs:
  memdump:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake zlib1g-dev libsnappy-dev liblz4-dev g++-multilib libunwind-dev libelf-dev
      - name: Build and run
        run: |
          set +e
          grep -m1 'model name' /proc/cpuinfo
          # The dump names sections through a string hash keyed on a reused buffer, so the build directory's
          # name decides which section names collide: swap the directory names between base and fix.
          build() { git clone -q --filter=blob:none https://github.com/lhns/dynamorio src-$2 && git -C src-$2 checkout -q $1 && git -C src-$2 submodule update -q --init --depth 1
                    cmake -S src-$2 -B b-$2 -DBUILD_TESTS=ON -DAUTOMATED_TESTING=ON -DBUILD_DOCS=OFF -DDEBUG=ON -DINTERNAL=ON >/dev/null && cmake --build b-$2 -j"$(nproc)" >/dev/null 2>&1 || echo "$2: build failed"; }
          build 7e8c88b7c0e43c1d16d92f8d7a002a872c788559 da60578
          build da60578e58d56694968b2fb34b300f1af61608f0 7e8c88b
          for d in da60578 7e8c88b; do
            f=0; for i in $(seq 20); do (cd b-$d && ctest -R 'client.memory_dump_test$' --timeout 300 >/dev/null 2>&1) || f=$((f+1)); done
            echo "RESULT memory_dump_test dir b-$d: $f of 20 failed"
          done
          echo "(b-da60578 holds base 7e8c88b; b-7e8c88b holds the fix da60578)"

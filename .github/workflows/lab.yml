name: lab
on:
  push:
    branches: ['lab-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: p1, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p2, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p3, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p4, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p5, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p6, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p7, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p8, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p9, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: p10, dr: 69d678e66466e6804526c09721ab2cb8052bf1b1, arg: "3000 jit"}
          - {name: c1, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c2, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c3, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c4, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c5, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c6, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c7, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c8, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c9, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
          - {name: c10, dr: 5e4ffb15d98963972a5e9cac86cb2bb4f72236bf, arg: "3000 jit"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: lab-dr-${{ matrix.dr }}
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y zlib1g-dev musl-tools gdb zstd
      - name: Build
        run: |
          sed -i "s/^set(V3COMPAT_DR_COMMIT .*/set(V3COMPAT_DR_COMMIT ${{ matrix.dr }})/" cmake/FetchDynamoRIO.cmake
          cmake -S . -B build && cmake --build build -j
      - name: Run
        timeout-minutes: 280
        env:
          ARG: ${{ matrix.arg }}
        run: |
          mkdir -p lab-out
          bash lab/run.sh $ARG 2>&1 | tee lab-out/log.txt | tail -200
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```'; tail -40 lab-out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: lab-out
          if-no-files-found: ignore
